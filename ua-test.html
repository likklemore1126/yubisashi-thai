<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ブラウザ確認テスト</title>
<style>
  body{ font-family:-apple-system, 'Noto Sans JP', sans-serif; background:#FBF7EF; color:#17242A; margin:0; padding:20px 16px; line-height:1.6; }
  h1{ font-size:18px; margin:0 0 6px; }
  p.lead{ font-size:13px; color:#6b6355; margin:0 0 16px; }
  .box{ background:#fff; border:1px solid #E4DAC4; border-radius:12px; padding:14px; margin-bottom:14px; }
  .label{ font-size:12px; color:#8B8272; margin-bottom:6px; }
  #ua{ font-family:ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  td{ padding:6px 4px; border-bottom:1px solid #E4DAC4; }
  td.r{ text-align:right; font-weight:700; }
  .yes{ color:#0F6B62; }
  .no{ color:#B3AA98; }
  button{ width:100%; padding:14px; font-size:15px; font-weight:700; background:#E8A33D; color:#17242A; border:none; border-radius:10px; }
  button.done{ background:#0F6B62; color:#fff; }
</style>
</head>
<body>
  <h1>ブラウザ確認テスト</h1>
  <p class="lead">このページを開いたアプリの名前を確認するためのページです。下のボタンで結果をコピーして、Claudeに貼り付けてください。</p>

  <button type="button" id="copyBtn">結果をコピー</button>

  <div class="box" style="margin-top:14px;">
    <div class="label">判定結果</div>
    <table id="result"></table>
  </div>

  <div class="box">
    <div class="label">ユーザーエージェント(ブラウザが名乗っている名前)</div>
    <div id="ua"></div>
  </div>

<script>
(function(){
  var ua = navigator.userAgent || '';
  var standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  var checks = [
    ['Instagram', /Instagram/i.test(ua)],
    ['Facebook系 (FBAN/FBAV)', /FBAN|FBAV/i.test(ua)],
    ['Threads', /Threads/i.test(ua)],
    ['Barcelona', /Barcelona/i.test(ua)],
    ['LINE', /\bLine\//i.test(ua)],
    ['iPhone/iPad', /iPhone|iPad|iPod/i.test(ua)],
    ['Android', /Android/i.test(ua)],
    ['Safariの名前あり', /Safari/i.test(ua)],
    ['ホーム画面から起動', standalone]
  ];

  document.getElementById('ua').textContent = ua;

  var table = document.getElementById('result');
  checks.forEach(function(c){
    var tr = document.createElement('tr');
    var td1 = document.createElement('td');
    td1.textContent = c[0];
    var td2 = document.createElement('td');
    td2.className = 'r ' + (c[1] ? 'yes' : 'no');
    td2.textContent = c[1] ? 'はい' : 'いいえ';
    tr.appendChild(td1);
    tr.appendChild(td2);
    table.appendChild(tr);
  });

  var report = checks.map(function(c){ return c[0] + ': ' + (c[1] ? 'はい' : 'いいえ'); }).join('\n') +
    '\nUA: ' + ua;

  var btn = document.getElementById('copyBtn');
  function done(){
    btn.textContent = 'コピーしました';
    btn.classList.add('done');
  }
  btn.addEventListener('click', function(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(report).then(done).catch(fallback);
    } else {
      fallback();
    }
  });
  function fallback(){
    try{
      var ta = document.createElement('textarea');
      ta.value = report;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){
      btn.textContent = 'コピーできませんでした。画面のスクショを送ってください';
    }
  }
})();
</script>
</body>
</html>
