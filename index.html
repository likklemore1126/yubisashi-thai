<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>指さしタイ na - トップ画面</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17242A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="指さしタイ na">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17242A;
    --paper:#FBF7EF;
    --sand:#F1E9D8;
    --marigold:#E8A33D;
    --marigold-deep:#C9812A;
    --teal:#0F6B62;
    --teal-deep:#0A4C46;
    --pink:#E23F73;
    --pink-deep:#B92D5B;
    --line:#E4DAC4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#DED2B0;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:24px 12px;
  }
  .device{
    width:100%;
    max-width:430px;
    background:var(--paper);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(23,36,42,0.45);
    position:relative;
    height:860px;
  }
  .page-scroll{
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (max-width:480px){
    body{ padding:0; }
    .device{
      height:100vh;
      height:100dvh;
      max-width:100%;
      border-radius:0;
      box-shadow:none;
    }
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:calc(22px + env(safe-area-inset-top)) 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:140px; height:140px;
    border-radius:50%;
    background:var(--marigold);
    opacity:0.15;
  }
  .wordmark{
    font-family:'Kanit', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .wordmark span.th{ color:var(--marigold); font-size:26px; }
  .tagline{ font-size:12.5px; opacity:0.75; margin-top:6px; letter-spacing:0.5px; }
  .header-tools{ display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .rate-status{
    font-size:11.5px; color:var(--marigold); font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:4px;
  }
  .calc-trigger{
    font-size:11.5px; color:var(--paper); font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3);
    border-radius:999px; padding:4px 10px;
  }
  .gender-toggle{ position:absolute; top:20px; right:16px; display:flex; gap:4px; z-index:2; }
  .gtbtn{
    background:rgba(255,255,255,0.1); color:var(--paper);
    border:1px solid rgba(255,255,255,0.3); border-radius:999px;
    padding:5px 10px; font-size:11px; font-family:'Noto Sans JP', sans-serif; cursor:pointer;
  }
  .gtbtn.active{ background:var(--marigold); color:var(--ink); border-color:var(--marigold); font-weight:600; }

  .search-wrap{ padding:16px 18px 4px; }
  .search-box{
    background:#fff; border:2px solid var(--ink); border-radius:14px;
    display:flex; align-items:center; gap:10px; padding:12px 14px;
  }
  .search-box input{
    border:none; outline:none; font-family:'Noto Sans JP', sans-serif;
    font-size:16px; width:100%; background:transparent; color:var(--ink);
  }
  .search-box input::placeholder{ color:#9A9284; }
  .search-icon{ font-size:16px; opacity:0.7; }
  .search-clear{
    display:none; background:var(--sand); border:none; border-radius:50%;
    width:24px; height:24px; color:#8B8272; font-size:13px; font-weight:700;
    cursor:pointer; flex:0 0 auto; align-items:center; justify-content:center;
  }
  .search-clear.show{ display:flex; }
  .search-hint{ font-size:11px; color:#8B8272; margin:6px 4px 0; }
  .search-suggestions{ margin:8px 0 0; }
  .suggestion-item{
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:7px; cursor:pointer; transition:background .12s ease;
  }
  .suggestion-item:active{ background:var(--sand); }
  .suggestion-th{ font-family:'Kanit', sans-serif; font-weight:600; font-size:17px; color:var(--ink); }
  .suggestion-jp{ font-size:11.5px; color:#8B8272; margin-top:2px; }
  .suggestion-pref{ font-size:11px; color:var(--teal); font-weight:700; margin-top:4px; }
  .fallback-box{ background:var(--sand); border:1.5px dashed var(--line); border-radius:12px; padding:13px; }
  .fallback-title{ font-family:'Kanit', sans-serif; font-weight:700; font-size:14px; color:var(--ink); }
  .fallback-desc{ font-size:11.5px; color:#8B8272; line-height:1.6; margin-top:6px; margin-bottom:10px; }
  .suggestion-item.fallback{ background:var(--marigold); border-color:var(--marigold-deep); margin-bottom:0; }
  .suggestion-item.fallback .suggestion-jp{ color:#5c4415; }

  .dest-result{
    margin:10px 18px 0; background:var(--teal); color:var(--paper);
    border-radius:16px; padding:16px; display:none;
  }
  .dest-result.show{ display:block; }
  .dest-th{ font-family:'Kanit', sans-serif; font-weight:700; font-size:24px; line-height:1.2; }
  .dest-jp{ font-size:12px; opacity:0.85; margin-top:2px; }
  .dest-pref{ font-size:11.5px; color:var(--marigold); font-weight:700; margin-top:4px; }
  .dest-phrase{
    margin-top:10px; background:rgba(255,255,255,0.14); border-radius:10px;
    padding:12px 14px; font-family:'Kanit', sans-serif; font-size:19px; font-weight:600;
  }
  .dest-phrase-jp{ font-size:11px; color:rgba(255,255,255,0.75); margin-top:5px; padding:0 2px; }
  .dest-modes{ display:flex; gap:8px; margin-top:12px; }
  .mode-btn{
    flex:1; background:var(--paper); color:var(--teal-deep); border:none;
    border-radius:10px; padding:9px 4px; font-family:'Noto Sans JP', sans-serif;
    font-weight:600; font-size:12.5px; cursor:pointer;
  }

  .section-label{
    font-size:12px; font-weight:700; color:#8B8272; letter-spacing:1px;
    margin:20px 18px 8px; display:flex; align-items:center; gap:6px;
  }
  .section-label .bar{ width:14px; height:3px; background:var(--marigold); border-radius:2px; }
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding:0 18px 4px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; background:var(--sand); border:1.5px solid var(--line);
    border-radius:999px; padding:9px 14px; font-size:12.5px; font-weight:500;
    display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap;
    transition:transform .12s ease;
  }
  .chip:active{ transform:scale(0.95); background:var(--marigold); border-color:var(--marigold-deep); }

  .situations{ padding:6px 14px 24px; display:flex; flex-direction:column; gap:8px; }
  .sit-row{
    display:flex; align-items:center; gap:12px; background:#fff;
    border:1.5px solid var(--line); border-radius:14px; padding:12px 14px;
    cursor:pointer; transition:transform .12s ease; position:relative; overflow:hidden;
  }
  .sit-row:active{ transform:scale(0.98); }
  .sit-row::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--accent, var(--teal)); }
  .sit-icon{
    width:50px; height:50px; border-radius:13px; background:var(--accent, var(--teal));
    display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; margin-left:4px;
    color:#fff;
  }
  .sit-text{ flex:1; }
  .sit-title{ font-family:'Kanit', sans-serif; font-weight:600; font-size:15px; }
  .sit-sub{ font-size:11px; color:#9A9284; margin-top:1px; }
  .sit-arrow{ font-size:16px; color:#C7BEA9; }
  .chip-icon{ display:inline-flex; color:var(--ink); }
  .icon-img{ filter:none; }
  header .icon-img{ filter:brightness(0) invert(1); }
  header .gtbtn.active .icon-img{ filter:none; }
  .sit-icon .icon-img{ filter:brightness(0) invert(1); }
  .selected-phrase:not(.empty) .icon-img{ filter:brightness(0) invert(1); }
  .dest-anchor .icon-img{ filter:brightness(0) invert(1); }
  .qmode-btn .icon-img{ filter:brightness(0) invert(1); }
  .qmode-btn.active .icon-img{ filter:none; }
  .ctitle-icon{ display:inline-flex; vertical-align:-4px; margin-right:6px; color:var(--ink); }
  .qmode-btn svg{ vertical-align:-3px; margin-right:2px; }

  .overlay{
    position:absolute; inset:0; background:rgba(23,36,42,0.45);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:5;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--paper);
    border-radius:22px 22px 0 0; padding:16px 18px 22px;
    transform:translateY(100%); transition:transform .25s cubic-bezier(.2,.8,.3,1);
    z-index:6; max-height:78%; overflow-y:auto;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px; }
  .sheet-title{ font-family:'Kanit', sans-serif; font-weight:600; font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

  .phrase-card{ background:var(--sand); border-radius:12px; padding:14px 15px; margin-bottom:9px; }
  .phrase-th{ font-family:'Kanit', sans-serif; font-weight:700; font-size:21px; color:var(--ink); }
  .phrase-jp{ font-size:12.5px; color:#6B6252; margin-top:4px; }

  .sheet-close{
    width:100%; margin-top:6px; background:var(--ink); color:var(--paper);
    border:none; border-radius:10px; padding:12px;
    font-family:'Noto Sans JP', sans-serif; font-weight:600; font-size:13px; cursor:pointer;
  }

  /* Full-screen composer (移動する/バス/鉄道/タクシー用) */
  .composer-screen{
    position:absolute; inset:0; background:var(--paper);
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
    z-index:8; pointer-events:none;
  }
  .composer-screen.show{ transform:translateY(0); pointer-events:auto; }
  .composer-header{
    display:flex; align-items:center; gap:8px;
    padding:calc(18px + env(safe-area-inset-top)) 18px 10px; flex:0 0 auto;
  }
  .composer-header .ctitle{ font-family:'Kanit', sans-serif; font-weight:600; font-size:17px; flex:1 1 auto; }
  .composer-close{
    background:var(--sand); border:1.5px solid var(--line); color:var(--ink);
    width:32px; height:32px; border-radius:50%; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .composer-fixed{ padding:2px 18px 6px; flex:0 0 auto; }
  .composer-list{
    flex:1 1 auto; overflow-y:auto; padding:4px 18px 28px;
    border-top:1px solid var(--line);
  }

  .combined-display{ background:var(--teal); color:#fff; border-radius:14px; padding:16px; margin-bottom:16px; }
  .combined-display.empty{
    background:transparent; border:1.5px dashed #C7BEA9; color:#9A9284; font-size:12.5px; line-height:1.6;
  }
  .combined-th{ font-family:'Kanit', sans-serif; font-weight:700; font-size:19px; line-height:1.4; }
  .combined-jp{ font-size:12.5px; margin-top:6px; opacity:0.85; }

  .dest-anchor{ background:var(--ink); color:var(--paper); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .dest-anchor.empty{ background:transparent; border:1.5px dashed #C7BEA9; color:#9A9284; font-size:12.5px; line-height:1.6; cursor:default; }
  .dest-anchor.collapsed{
    display:flex; align-items:center; gap:8px;
    padding:9px 14px; border-radius:999px;
  }
  .anchor-pill-icon{ font-size:12px; }
  .anchor-pill-text{
    font-family:'Kanit', sans-serif; font-weight:600; font-size:13px; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .anchor-pill-arrow{ font-size:10px; opacity:0.6; }
  .anchor-label{ font-size:10.5px; letter-spacing:1px; color:var(--marigold); font-weight:700; margin-bottom:5px; }
  .anchor-th{ font-family:'Kanit', sans-serif; font-weight:700; font-size:23px; line-height:1.35; }
  .anchor-jp{ font-size:12.5px; opacity:0.75; margin-top:5px; }

  .selected-phrase{ background:var(--teal); color:#fff; border-radius:14px; padding:18px 16px; margin-bottom:16px; }
  .selected-phrase.empty{ background:var(--sand); color:#9A9284; border:1.5px dashed var(--line); font-size:13px; }
  .sp-th{ font-family:'Kanit', sans-serif; font-weight:700; font-size:26px; line-height:1.4; }
  .sp-jp{ font-size:13.5px; margin-top:7px; opacity:0.9; }
  .ticket-stepper{
    margin-top:14px; display:flex; align-items:center; gap:16px; justify-content:center;
  }
  .ticket-stepper button{
    width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,0.2);
    color:#fff; font-size:20px; font-weight:700; cursor:pointer;
  }
  .ticket-stepper span{ font-family:'Kanit', sans-serif; font-weight:700; font-size:18px; color:#fff; min-width:48px; text-align:center; }
  .landscape-display{
    display:none; position:fixed; inset:0; z-index:999; background:var(--ink); color:#fff;
    flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;
    cursor:pointer;
  }
  .landscape-display.show{ display:flex; }
  .landscape-th{ font-family:'Kanit', sans-serif; font-weight:700; line-height:1.15; }
  .landscape-jp{ font-size:min(4vw, 22px); opacity:0.65; margin-top:18px; }
  .landscape-close{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); right:calc(20px + env(safe-area-inset-right)); font-size:13px; opacity:0.55;
    font-family:'Noto Sans JP', sans-serif;
  }
  .nb-trigger{
    margin-top:12px; background:rgba(255,255,255,0.16); color:#fff;
    border:1px solid rgba(255,255,255,0.4); border-radius:10px; padding:9px 13px;
    font-family:'Noto Sans JP', sans-serif; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .fullscreen-btn{
    margin-top:12px; margin-right:8px; background:var(--marigold); color:var(--ink);
    border:none; border-radius:10px; padding:9px 13px;
    font-family:'Noto Sans JP', sans-serif; font-size:12.5px; font-weight:700; cursor:pointer;
  }

  .nb-display{
    background:var(--ink); color:#fff; border-radius:16px; padding:24px 18px;
    margin:0 18px 16px; text-align:center;
    min-height:34vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .calc-value{ font-family:'Kanit', sans-serif; font-weight:700; font-size:64px; word-break:break-all; line-height:1.1; }
  .nb-jpy{ font-size:16px; color:var(--marigold); margin-top:10px; font-weight:600; }
  .nb-rate-setup{ margin-top:14px; display:flex; gap:6px; align-items:center; justify-content:center; font-size:13px; flex-wrap:wrap; }
  .nb-rate-setup span{ opacity:0.8; }
  .nb-rate-setup input{ width:70px; padding:7px 8px; border-radius:8px; border:none; font-size:16px; text-align:center; }
  .nb-rate-setup button{
    background:var(--marigold); border:none; border-radius:8px; padding:7px 12px;
    font-size:12px; font-weight:700; cursor:pointer; color:var(--ink);
  }
  .nb-keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 18px 18px; }
  .nb-key{
    background:var(--sand); border:1.5px solid var(--line); border-radius:14px; padding:13px 0;
    font-family:'Kanit', sans-serif; font-weight:700; font-size:24px; text-align:center; cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .nb-key:active{ background:var(--marigold); border-color:var(--marigold-deep); }
  .nb-key.action{ background:var(--ink); color:#fff; font-family:'Noto Sans JP', sans-serif; font-size:14px; font-weight:600; }
  .nb-key.eq{ font-size:28px; }
  .calc-keys{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0 18px 24px; }
  .nb-key.op{ background:var(--teal); color:#fff; }
  .calc-keys .nb-key.eq{ background:var(--marigold); color:var(--ink); }
  .nb-keys.phase-digits .nb-key:not(.action){
    background:var(--marigold); border-color:var(--marigold-deep);
  }
  .calc-rate-hint{ font-size:17px; color:var(--marigold); margin-top:8px; font-weight:600; }
  .nb-question{ margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.15); }
  .nb-question-th{ font-family:'Kanit', sans-serif; font-weight:700; font-size:24px; color:var(--marigold); }
  .nb-question-jp{ font-size:15px; color:rgba(255,255,255,0.75); margin-top:6px; }
  .qmode-row{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .qmode-btn{
    background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.25); color:#fff;
    border-radius:999px; padding:7px 12px; font-size:12px; font-family:'Noto Sans JP', sans-serif;
    font-weight:600; cursor:pointer;
  }
  .qmode-btn.active{ background:var(--marigold); border-color:var(--marigold); color:var(--ink); }
  .calc-rate-hint.confirmed{ color:#fff; }
  .time-period-toggle{ display:flex; gap:8px; padding:0 18px 16px; }
  .tp-btn{
    flex:1; background:var(--sand); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 6px; font-size:15px; font-weight:600; cursor:pointer;
    font-family:'Kanit', sans-serif;
  }
  .tp-btn.phase-active{ background:var(--marigold); border-color:var(--marigold-deep); color:var(--ink); }
  .tp-btn.selected{ border-color:var(--marigold-deep); border-width:2px; }
  .time-active{ color:var(--marigold); }
  .time-ampm-placeholder{
    display:inline-flex; flex-direction:column; justify-content:center;
    font-size:14px; line-height:1.15; color:var(--marigold); font-weight:700;
    vertical-align:middle; margin-right:4px;
  }
  .time-ampm{ color:var(--marigold); font-size:22px; }

  .rate-overlay{
    position:absolute; inset:0; background:rgba(23,36,42,0.5);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:20;
  }
  .rate-overlay.show{ opacity:1; pointer-events:auto; }
  .rate-modal{
    position:absolute; left:50%; top:44%; width:82%;
    transform:translate(-50%,-45%) scale(0.95);
    background:var(--paper); border-radius:18px; padding:22px 20px;
    z-index:21; opacity:0; pointer-events:none; transition:all .2s ease;
  }
  .rate-modal.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .rate-modal-title{ font-family:'Kanit', sans-serif; font-weight:700; font-size:17px; margin-bottom:8px; }
  .rate-modal-desc{ font-size:12px; color:#6B6252; line-height:1.6; margin-bottom:16px; }
  .rate-modal-input-row{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; margin-bottom:18px; }
  .rate-modal-input-row input{
    width:90px; padding:9px 10px; border-radius:10px; border:1.5px solid var(--line);
    font-size:16px; text-align:center;
  }
  .rate-modal-save{
    width:100%; background:var(--ink); color:#fff; border:none; border-radius:10px;
    padding:12px; font-weight:600; font-size:14px; cursor:pointer; margin-bottom:8px;
  }
  .rate-modal-close{ width:100%; background:transparent; color:#8B8272; border:none; padding:8px; font-size:12.5px; cursor:pointer; }

  .mode-group-label{ font-size:11px; font-weight:700; color:#8B8272; letter-spacing:1px; margin:14px 2px 6px; }
  .mode-group-label svg{ vertical-align:-3px; margin-right:2px; }
  .follow-item{
    background:var(--sand); border:1.5px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:7px; cursor:pointer; transition:all .12s ease;
  }
  .follow-item .fi-th{ font-family:'Kanit', sans-serif; font-weight:600; font-size:16px; }
  .follow-item .fi-jp{ font-size:11.5px; color:#8B8272; margin-top:2px; }
  .follow-item.selected{ background:var(--marigold); border-color:var(--marigold-deep); }
  .follow-item.selected .fi-jp{ color:#5c4415; }
</style>
</head>
<body>

<div class="device">
<div class="page-scroll">
  <header>
    <div class="gender-toggle" id="genderToggle">
      <button class="gtbtn active" data-g="female" onclick="setGender('female')"><span class="icon-slot" data-icon="female" data-size="22"></span> 女性</button>
      <button class="gtbtn" data-g="male" onclick="setGender('male')"><span class="icon-slot" data-icon="male" data-size="22"></span> 男性</button>
    </div>
    <div class="wordmark">指さしタイ<span class="th"> na</span></div>
    <div class="tagline">見せるだけで、伝わる。</div>
    <div class="header-tools">
      <div class="rate-status" id="rateStatus" onclick="openRateSheet()">💴 レート未設定(タップで設定) ›</div>
      <div class="calc-trigger" onclick="openCalc()"><span class="icon-slot" data-icon="calculator" data-size="22"></span> ฿計算機</div>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon"><span class="icon-slot" data-icon="search" data-size="22"></span></span>
      <input id="searchInput" type="text" placeholder="行き先をペーストして検索(例: วัดพระแก้ว)">
      <button type="button" class="search-clear" id="searchClearBtn" onclick="clearSearch()">✕</button>
    </div>
    <div class="search-hint">お試し: 「アユタヤ」「チェンマイ」「わっとあるん」「あんぱわー」などと入力してみてください</div>
    <div class="search-suggestions" id="searchSuggestions"></div>
  </div>

  <div class="dest-result" id="destResult">
    <div class="dest-th" id="destTh"></div>
    <div class="dest-jp" id="destJp"></div>
    <div class="dest-phrase" id="destPhrase"></div>
    <div class="dest-phrase-jp" id="destPhraseJp"></div>
    <button class="fullscreen-btn" onclick="showFullscreenNow()" style="margin-top:10px;"><span class="icon-slot" data-icon="search" data-size="17"></span> これだけ大きく見せる</button>
    <div class="dest-modes">
      <button class="mode-btn" onclick="openModeList('bus')"><span class="icon-slot" data-icon="bus" data-size="20"></span> バス</button>
      <button class="mode-btn" onclick="openModeList('train')"><span class="icon-slot" data-icon="train" data-size="20"></span> 鉄道</button>
      <button class="mode-btn" onclick="openModeList('taxi')"><span class="icon-slot" data-icon="taxi" data-size="20"></span> タクシー</button>
    </div>
  </div>

  <div class="section-label"><span class="bar"></span>近くの◯◯を伝える</div>
  <div class="chip-row" id="nearbyRow"></div>

  <div class="section-label"><span class="bar"></span>シチュエーションから探す</div>
  <div class="situations" id="situationList"></div>
</div>

  <div class="overlay" id="overlay" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">

    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div id="sheetBody"></div>
    <button class="sheet-close" onclick="closeSheet()">閉じる</button>
  </div>

  <div class="composer-screen" id="composerScreen">
    <div class="composer-header">
      <div class="ctitle" id="composerTitle"></div>
      <button class="composer-close" onclick="closeComposer()">✕</button>
    </div>
    <div class="composer-fixed" id="composerFixed"></div>
    <div class="composer-list" id="composerList"></div>
  </div>

  <div class="rate-overlay" id="rateOverlay" onclick="closeRateSheet()"></div>
  <div class="rate-modal" id="rateModal">
    <div class="rate-modal-title">💴 レート設定</div>
    <div class="rate-modal-desc">1バーツが何円か、出発前に調べて設定しておくと、現地で毎回調べる手間が省けます。</div>
    <div class="rate-modal-input-row">
      <span>1บาท=</span>
      <input type="number" id="topRateInput" placeholder="例: 4.3" step="0.1" inputmode="decimal">
      <span>円</span>
    </div>
    <button class="rate-modal-save" onclick="saveTopRate()">保存する</button>
    <button class="rate-modal-close" onclick="closeRateSheet()">閉じる</button>
  </div>

  <div class="composer-screen" id="calcScreen" style="z-index:9;">
    <div class="composer-header">
      <div class="ctitle" id="calcTitle"><span class="icon-slot" data-icon="calculator" data-size="20"></span>฿計算機</div>
      <button class="fullscreen-btn" style="margin:0;" onclick="showFullscreenNow()"><span class="icon-slot" data-icon="search" data-size="17"></span>大きく見せる</button>
      <button class="composer-close" onclick="closeCalc()">✕</button>
    </div>
    <div class="nb-display" id="calcDisplay"></div>
    <div class="nb-keys calc-keys">
      <div class="nb-key" onclick="calcClearAll()">C</div>
      <div class="nb-key" onclick="calcBackspace()">⌫</div>
      <div class="nb-key" onclick="calcDigit('.')">.</div>
      <div class="nb-key op" onclick="calcOp('÷')">÷</div>
      <div class="nb-key" onclick="calcDigit('7')">7</div>
      <div class="nb-key" onclick="calcDigit('8')">8</div>
      <div class="nb-key" onclick="calcDigit('9')">9</div>
      <div class="nb-key op" onclick="calcOp('×')">×</div>
      <div class="nb-key" onclick="calcDigit('4')">4</div>
      <div class="nb-key" onclick="calcDigit('5')">5</div>
      <div class="nb-key" onclick="calcDigit('6')">6</div>
      <div class="nb-key op" onclick="calcOp('-')">−</div>
      <div class="nb-key" onclick="calcDigit('1')">1</div>
      <div class="nb-key" onclick="calcDigit('2')">2</div>
      <div class="nb-key" onclick="calcDigit('3')">3</div>
      <div class="nb-key op" onclick="calcOp('+')">+</div>
      <div class="nb-key" onclick="calcDigit('000')">000</div>
      <div class="nb-key" onclick="calcDigit('00')">00</div>
      <div class="nb-key" onclick="calcDigit('0')">0</div>
      <div class="nb-key eq" onclick="calcEquals()">=</div>
    </div>
  </div>

  <div class="composer-screen" id="timeBoardScreen" style="z-index:9;">
    <div class="composer-header">
      <div class="ctitle"><span class="icon-slot" data-icon="clock" data-size="20"></span>時刻で答える</div>
      <button class="fullscreen-btn" style="margin:0;" onclick="showFullscreenNow()"><span class="icon-slot" data-icon="search" data-size="17"></span>大きく見せる</button>
      <button class="composer-close" onclick="closeTimeBoard()">✕</button>
    </div>
    <div class="nb-display" id="timeDisplay"></div>
    <div class="time-period-toggle">
      <button class="tp-btn" id="tpAm" onclick="setTimePeriod('am')">ก่อนเที่ยง(午前)</button>
      <button class="tp-btn" id="tpPm" onclick="setTimePeriod('pm')">หลังเที่ยง(午後)</button>
    </div>
    <div class="nb-keys" id="timeKeys">
      <div class="nb-key" onclick="timeDigit('1')">1</div>
      <div class="nb-key" onclick="timeDigit('2')">2</div>
      <div class="nb-key" onclick="timeDigit('3')">3</div>
      <div class="nb-key" onclick="timeDigit('4')">4</div>
      <div class="nb-key" onclick="timeDigit('5')">5</div>
      <div class="nb-key" onclick="timeDigit('6')">6</div>
      <div class="nb-key" onclick="timeDigit('7')">7</div>
      <div class="nb-key" onclick="timeDigit('8')">8</div>
      <div class="nb-key" onclick="timeDigit('9')">9</div>
      <div class="nb-key" onclick="timeDigit('0')">0</div>
      <div class="nb-key eq" onclick="timeNextField()">:</div>
      <div class="nb-key" onclick="timeDigit('00')">00</div>
      <div class="nb-key action" style="grid-column:span 2; font-size:16px;" onclick="timeBackspace()">⌫ ย้อนกลับ(戻す)</div>
      <div class="nb-key action" style="font-size:16px;" onclick="timeClear()">C ล้าง</div>
    </div>
  </div>

  <div class="landscape-display" id="landscapeDisplay" onclick="closeLandscapeDisplay()">
    <div class="landscape-close">タップで閉じる ✕</div>
    <div class="landscape-th" id="landscapeTh"></div>
    <div class="landscape-jp" id="landscapeJp"></div>
  </div>

</div>

function fitLandscapeText(){
  const el = document.getElementById('landscapeTh');
  if(!el) return;
  const maxWidth = window.innerWidth * 0.9;
  const maxHeight = window.innerHeight * 0.6;
  let fontSize = 220;
  el.style.fontSize = fontSize + 'px';
  while(fontSize > 24 && (el.scrollWidth > maxWidth || el.scrollHeight > maxHeight)){
    fontSize -= 6;
    el.style.fontSize = fontSize + 'px';
  }
}
function showFullscreenNow(){
  if(!lastShownPhrase) return;
  landscapeManuallyClosed = false;
  document.getElementById('landscapeTh').textContent = lastShownPhrase.th;
  document.getElementById('landscapeJp').textContent = lastShownPhrase.jp;
  document.getElementById('landscapeDisplay').classList.add('show');
  requestAnimationFrame(fitLandscapeText);
}
function fullscreenBtnHtml(){
  return `<button class="fullscreen-btn" onclick="event.stopPropagation(); showFullscreenNow();">${iconSvg('search', 16)} これだけ大きく見せる</button>`;
}
function checkOrientationDisplay(){
  const overlay = document.getElementById('landscapeDisplay');
  if(!overlay) return;
  const isLandscape = window.matchMedia('(orientation: landscape)').matches;
  if(isLandscape && lastShownPhrase && !landscapeManuallyClosed){
    document.getElementById('landscapeTh').textContent = lastShownPhrase.th;
    document.getElementById('landscapeJp').textContent = lastShownPhrase.jp;
    overlay.classList.add('show');
    requestAnimationFrame(fitLandscapeText);
  } else {
    overlay.classList.remove('show');
  }
}
function closeLandscapeDisplay(){
  landscapeManuallyClosed = true;
  checkOrientationDisplay();
}

function setTimePeriod(p){
  timePeriod = p;
  document.getElementById('tpAm').classList.toggle('selected', p === 'am');
  document.getElementById('tpPm').classList.toggle('selected', p === 'pm');
  renderTimeDisplay();
}
function timeDigit(d){
  if(timeField === 'hh'){
    if(timeHH.length + d.length > 2) return;
    const candidate = timeHH + d;
    if(candidate === '0' || candidate === '00') return;
    if(parseInt(candidate, 10) <= 12){ timeHH = candidate; }
  } else {
    if(timeMM.length + d.length > 2) return;
    const candidate = timeMM + d;
    if(parseInt(candidate, 10) <= 59){ timeMM = candidate; }
  }
  renderTimeDisplay();
}
function timeNextField(){
  if(timeHH === '') return;
  timeField = 'mm';
  renderTimeDisplay();
}
function timeBackspace(){
  if(timeField === 'mm'){
    if(timeMM.length > 0){ timeMM = timeMM.slice(0, -1); }
    else { timeField = 'hh'; }
  } else {
    timeHH = timeHH.slice(0, -1);
  }
  renderTimeDisplay();
}
function timeClear(){
  timeHH = '';
  timeMM = '';
  timeField = 'hh';
  timePeriod = null;
  document.getElementById('tpAm').classList.remove('selected');
  document.getElementById('tpPm').classList.remove('selected');
  renderTimeDisplay();
}
function renderTimeDisplay(){
  const hhDisp = timeHH === '' ? '--' : timeHH;
  const mmDisp = timeMM === '' ? '--' : timeMM;
  const ampmTag = timePeriod === 'am' ? 'AM' : (timePeriod === 'pm' ? 'PM' : '');
  const isComplete = timeHH !== '' && timeMM.length === 2 && timePeriod !== null;

  // phase: 'period' (choosing AM/PM) -> 'digits' (typing hour/minute) -> 'done'
  const phase = timePeriod === null ? 'period' : (isComplete ? 'done' : 'digits');
  document.getElementById('tpAm').classList.toggle('phase-active', phase === 'period');
  document.getElementById('tpPm').classList.toggle('phase-active', phase === 'period');
  document.getElementById('timeKeys').classList.toggle('phase-digits', phase === 'digits');

  let timeLine;
  if(isComplete){
    timeLine = `${ampmTag} ${hhDisp}:${mmDisp}`;
    setLastPhrase(timeLine, '');
  } else {
    const hhCls = (phase === 'digits' && timeField === 'hh') ? ' time-active' : '';
    const mmCls = (phase === 'digits' && timeField === 'mm') ? ' time-active' : '';
    const colonCls = hhCls;
    const ampmHtml = phase === 'period'
      ? `<span class="time-ampm-placeholder">AM<br>PM</span> `
      : (ampmTag ? `${ampmTag} ` : '');
    timeLine = `${ampmHtml}<span class="${hhCls}">${hhDisp}</span><span class="${colonCls}">:</span><span class="${mmCls}">${mmDisp}</span>`;
  }

  let periodLabel;
  if(timePeriod === 'am') periodLabel = 'ก่อนเที่ยง(午前)';
  else if(timePeriod === 'pm') periodLabel = 'หลังเที่ยง(午後)';
  else periodLabel = `午前/午後を選んでください ${iconSvg('pointhand', 19)}`;
  const stepLabel = isComplete
    ? 'กรอกเสร็จแล้ว(入力完了)'
    : (timeField === 'hh' ? 'กรุณาใส่ชั่วโมง(時を入力してください)' : 'กรุณาใส่นาที(分を入力してください)');
  const periodCls = timePeriod !== null ? 'calc-rate-hint confirmed' : 'calc-rate-hint';
  const stepCls = isComplete ? 'calc-rate-hint confirmed' : 'calc-rate-hint';
  document.getElementById('timeDisplay').innerHTML =
    `<div class="calc-value">${timeLine}</div>
     <div class="${periodCls}">${periodLabel}</div>
     <div class="${stepCls}">${stepLabel}</div>`;
}

/* ---------- shared calculator (standalone ฿計算機 / 質問への数字回答の両方で使用) ---------- */
let calcMode = 'thb'; // 'thb' | 'phrase'
let calcSelectedModeIdx = 0;
let calcPhraseConfig = null;
let calcCurrent = '0';
let calcPrev = null;
let calcOperator = null;
let calcResetNext = false;

function openCalc(){
  calcMode = 'thb';
  calcPhraseConfig = null;
  document.getElementById('calcTitle').innerHTML = `${iconSvg('calculator', 20)}฿計算機`;
  calcClearAll();
  document.getElementById('calcScreen').classList.add('show');
}
function closeCalc(){
  document.getElementById('calcScreen').classList.remove('show');
  restoreParentPhrase();
}
function calcDigit(d){
  if(calcResetNext){ calcCurrent = '0'; calcResetNext = false; }
  if(d === '.'){
    if(!calcCurrent.includes('.')) calcCurrent += '.';
    calcRender();
    return;
  }
  if(calcCurrent === '0'){
    if(d !== '0' && d !== '00' && d !== '000'){ calcCurrent = d; }
    calcRender();
    return;
  }
  if(calcCurrent.length + d.length <= 9){
    calcCurrent += d;
  }
  calcRender();
}
function calcBackspace(){
  if(calcResetNext) return;
  calcCurrent = calcCurrent.length > 1 ? calcCurrent.slice(0, -1) : '0';
  calcRender();
}
function calcOp(op){
  if(calcOperator && !calcResetNext){ calcEquals(); }
  calcPrev = parseFloat(calcCurrent);
  calcOperator = op;
  calcResetNext = true;
  calcRender();
}
function calcEquals(){
  if(calcOperator === null || calcPrev === null) return;
  const cur = parseFloat(calcCurrent);
  let result = calcPrev;
  if(calcOperator === '+') result = calcPrev + cur;
  else if(calcOperator === '-') result = calcPrev - cur;
  else if(calcOperator === '×') result = calcPrev * cur;
  else if(calcOperator === '÷') result = cur !== 0 ? calcPrev / cur : 0;
  result = Math.round(result * 100) / 100;
  calcCurrent = String(result);
  calcOperator = null;
  calcPrev = null;
  calcResetNext = true;
  calcRender();
}
function calcClearAll(){
  calcCurrent = '0';
  calcPrev = null;
  calcOperator = null;
  calcResetNext = false;
  calcRender();
}
function formatCalcDisplay(str){
  if(str === '' || str === '-') return '0';
  const neg = str.startsWith('-');
  const body = neg ? str.slice(1) : str;
  const hasDot = body.includes('.');
  const [intPart, fracPart = ''] = body.split('.');
  const intFormatted = Number(intPart || '0').toLocaleString('en-US');
  return (neg ? '-' : '') + intFormatted + (hasDot ? '.' + fracPart : '');
}
function setCalcMode(i){
  calcSelectedModeIdx = i;
  calcClearAll();
}
function calcRender(){
  const num = parseFloat(calcCurrent) || 0;
  const formatted = formatCalcDisplay(calcCurrent);
  let mainText, showJpy, questionHtml = '';
  if(calcMode === 'phrase' && calcPhraseConfig){
    const cfg = calcPhraseConfig;
    mainText = cfg.position === 'prefix' ? `${cfg.unit} ${formatted}` : `${formatted} ${cfg.unit}`;
    showJpy = !!cfg.jpy;
    if(cfg.modes){
      const modeBtns = cfg.modes.map((m, i) =>
        `<button class="qmode-btn ${i===calcSelectedModeIdx ? 'active' : ''}" onclick="event.stopPropagation(); setCalcMode(${i});">${iconSvg(m.icon, 19)} ${m.label}</button>`
      ).join('');
      const active = cfg.modes[calcSelectedModeIdx];
      const qTh = fullTh(active.qBase, active.qType);
      questionHtml = `<div class="qmode-row">${modeBtns}</div>
        <div class="nb-question"><div class="nb-question-th">${qTh}</div><div class="nb-question-jp">${active.qJp || ''}</div></div>`;
    } else if(cfg.qBase){
      const qTh = fullTh(cfg.qBase, cfg.qType);
      questionHtml = `<div class="nb-question"><div class="nb-question-th">${qTh}</div><div class="nb-question-jp">${cfg.qJp || ''}</div></div>`;
    }
  } else {
    mainText = `฿ ${formatted}`;
    showJpy = true;
  }
  let jpyHtml = '';
  if(showJpy){
    if(thbToJpyRate){
      const jpy = Math.round(num * thbToJpyRate).toLocaleString('en-US');
      jpyHtml = `<div class="nb-jpy">≈ ${jpy}円</div>`;
    } else {
      jpyHtml = `<div class="nb-rate-setup">
        <span>1บาท=</span>
        <input type="number" id="calcRateInput" placeholder="例: 4.3" step="0.1" inputmode="decimal">
        <span>円</span>
        <button onclick="saveRateFromCalc()">設定</button>
      </div>`;
    }
  } else if(calcMode === 'phrase' && calcPhraseConfig && calcPhraseConfig.unitJp){
    jpyHtml = `<div class="nb-jpy">(${formatted}${calcPhraseConfig.unitJp})</div>`;
  }
  document.getElementById('calcDisplay').innerHTML = `${questionHtml}<div class="calc-value">${mainText}</div>${jpyHtml}`;
  setLastPhrase(mainText, '');
}
function saveRateFromCalc(){
  const v = parseFloat(document.getElementById('calcRateInput').value);
  if(v && v > 0){
    thbToJpyRate = v;
    persistRate();
    updateRatePillText();
    calcRender();
  }
}


function setGender(g){
  genderState.value = g;
  document.querySelectorAll('.gtbtn').forEach(b => b.classList.toggle('active', b.dataset.g === g));
  try{ localStorage.setItem('yubisashi_gender', g); }catch(e){}
  refreshVisible();
}
function refreshVisible(){
  if(currentDestination){
    document.getElementById('destPhrase').textContent = "จะไป" + currentDestination.th + particle('s');
    document.getElementById('destPhraseJp').textContent = currentDestination.jp + "へ行くつもりです";
  }
  if(!openState) return;
  if(openState.type === 'transport' || openState.type === 'mode'){
    renderComposerFixed();
    renderComposerList();
  } else if(openState.type === 'category'){
    renderCategoryFixed();
    renderCategoryList();
  } else if(openState.type === 'nearby'){
    openNearby(openState.index);
  }
}

function normalizeSearch(str){
  return str.toLowerCase().replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function findMatches(query){
  const nq = normalizeSearch(query);
  if(!nq) return [];
  return destinations.filter(d => {
    const pool = [...d.key, d.th, d.jp, d.pref];
    return pool.some(k => normalizeSearch(k).includes(nq));
  }).slice(0, 6);
}
function renderSuggestions(matches, query){
  const box = document.getElementById('searchSuggestions');
  if(matches.length === 0){
    box.innerHTML = `<div class="fallback-box">
      <div class="fallback-title">「${query}」は見つかりませんでした</div>
      <div class="fallback-desc">データベースにまだ無い場所です。もしGoogleマップの正式名称やタイ文字をコピペしたものなら、そのまま使っても現地の方に伝わる可能性が高いです。</div>
      <div class="suggestion-item fallback" onclick="selectFallback()">
        <div class="suggestion-th">${iconSvg('search', 18)}「${query}」をそのまま使う</div>
        <div class="suggestion-jp">入力した文字を行き先として使用します</div>
      </div>
    </div>`;
    return;
  }
  box.innerHTML = matches.map((d, i) =>
    `<div class="suggestion-item" onclick="selectSuggestion(${i})">
       <div class="suggestion-th">${d.th}</div>
       <div class="suggestion-jp">${d.jp}${d.note ? ' ・ ' + d.note : ''}</div>
       <div class="suggestion-pref">【${d.pref}】</div>
     </div>`
  ).join('');
}
let currentMatches = [];
function applyDestination(found){
  if(!currentDestination || currentDestination.th !== found.th){
    selectedFollowUp = null;
    anchorExpanded = true;
    ticketSelected = false;
    ticketCount = 1;
  }
  currentDestination = found;
  document.getElementById('destTh').textContent = found.th;
  const prefHtml = found.pref ? `<div class="dest-pref">【${found.pref}】</div>` : '';
  document.getElementById('destJp').innerHTML = `${found.jp}${found.note ? ' ・ ' + found.note : ''}${prefHtml}`;
  const destPhraseTh = "จะไป" + found.th + particle('s');
  document.getElementById('destPhrase').textContent = destPhraseTh;
  document.getElementById('destPhraseJp').textContent = found.jp + "へ行くつもりです";
  document.getElementById('destResult').classList.add('show');
  document.getElementById('searchSuggestions').innerHTML = '';
  setLastPhrase(destPhraseTh, found.jp + "へ行くつもりです");
}
function selectSuggestion(i){
  const found = currentMatches[i];
  if(!found) return;
  applyDestination(found);
}
function selectFallback(){
  const raw = document.getElementById('searchInput').value.trim();
  if(!raw) return;
  applyDestination({ th: raw, jp: raw, pref: null, note: '入力内容をそのまま使用(未登録の場所)' });
}

function updateClearBtnVisibility(){
  const btn = document.getElementById('searchClearBtn');
  const val = document.getElementById('searchInput').value;
  btn.classList.toggle('show', val.length > 0);
}
function clearSearch(){
  const input = document.getElementById('searchInput');
  input.value = '';
  input.focus();
  currentDestination = null;
  document.getElementById('destResult').classList.remove('show');
  document.getElementById('searchSuggestions').innerHTML = '';
  currentMatches = [];
  updateClearBtnVisibility();
}
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  const result = document.getElementById('destResult');
  updateClearBtnVisibility();
  if(!q){
    currentDestination = null;
    result.classList.remove('show');
    document.getElementById('searchSuggestions').innerHTML = '';
    currentMatches = [];
    return;
  }
  currentMatches = findMatches(q);
  renderSuggestions(currentMatches, q);
  if(currentMatches.length === 0){
    currentDestination = null;
    result.classList.remove('show');
  }
});
document.getElementById('searchInput').addEventListener('focus', (e) => {
  const q = e.target.value.trim();
  if(q){
    currentMatches = findMatches(q);
    renderSuggestions(currentMatches, q);
  }
});

try{
  const savedRate = localStorage.getItem('yubisashi_thb_rate');
  if(savedRate){ thbToJpyRate = parseFloat(savedRate); }
}catch(e){}

try{
  const savedGender = localStorage.getItem('yubisashi_gender');
  if(savedGender === 'male' || savedGender === 'female'){
    genderState.value = savedGender;
    document.querySelectorAll('.gtbtn').forEach(b => b.classList.toggle('active', b.dataset.g === savedGender));
  }
}catch(e){}

document.querySelectorAll('.icon-slot').forEach(el => {
  const key = el.dataset.icon;
  const size = parseInt(el.dataset.size, 10) || 16;
  el.outerHTML = iconSvg(key, size);
});
renderNearby();
renderSituations();
updateRatePillText();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.log('Service Worker registration failed:', err);
    });
  });
}
</script>
